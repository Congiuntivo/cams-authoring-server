default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: local
    hooks:
      - id: dart-format
        name: Dart Format
        types_or: [dart]
        entry: dart format .
        language: system
      - id: dart-analyze
        name: Dart Analyze
        entry: dart analyze
        language: system
      - id: flutter-import-sorter
        name: Flutter Import Sorter
        types_or: [dart]
        entry: dart run import_sorter:main
        language: system
        pass_filenames: false