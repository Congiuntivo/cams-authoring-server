name: study_protocol_authoring_server
description: Minimal stateful Dart server for interactive study protocol authoring.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  yaml: ^3.1.3

  carp_core: ^2.1.2
  carp_backend: ^2.0.0
  carp_serializable: ^2.0.1

  carp_mobile_sensing: ^2.1.1

  carp_context_package: ^2.0.0
  carp_esense_package: ^2.0.0
  carp_health_package: ^4.0.0
  carp_movesense_package: ^2.0.0
  carp_movisens_package: ^2.0.0
  carp_polar_package: ^2.0.0
  carp_survey_package: ^2.0.0

  health: ^13.3.1

  is_valid: ^0.0.8
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  build: ^2.4.1
  analyzer: ^6.0.0
  openapi_generator_annotations: ^6.1.0
  openapi_generator: ^6.1.0
  source_gen: ^1.5.0
  import_sorter: ^4.6.0

import_sorter:
  emojis: true # Optional, defaults to false
  comments: false # Optional, defaults to true
  ignored_files: # Optional, defaults to []
    - lib/src/generated/.* # Regex: ignore all files in lib/src/generated

flutter:
  uses-material-design: true
