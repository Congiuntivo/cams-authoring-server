name: study_protocol_authoring_server
description: Minimal stateful Dart server for interactive study protocol authoring.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  yaml: ^3.1.3

  carp_serializable: ^2.0.0
  carp_core: ^1.8.0
  carp_mobile_sensing: ^1.12.5
  carp_context_package: ^1.10.0
  carp_health_package: ^3.0.0
  carp_polar_package: ^1.6.0
  carp_movesense_package: ^1.6.0
  carp_backend: ^1.9.0

  shelf: ^1.4.2
  shelf_router: ^1.1.4
  tuple: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  build: ^2.4.1
  analyzer: ^6.0.0
  openapi_generator_annotations: ^6.1.0
  openapi_generator: ^6.1.0
  source_gen: ^1.5.0
  import_sorter: ^4.6.0


import_sorter:
  emojis: true # Optional, defaults to false
  comments: false # Optional, defaults to true
  ignored_files: # Optional, defaults to []
    - lib/src/generated/.* # Regex: ignore all files in lib/src/generated

flutter:
  uses-material-design: true
