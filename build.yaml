targets:
  $default:
    builders:
      study_protocol_authoring_server|open_api_spec_builder:
        generate_for:
          - lib/src/http/handlers/authoring_routes.dart

builders:
  open_api_spec_builder:
    import: "package:study_protocol_authoring_server/openapi_spec_builder.dart"
    builder_factories: ["openApiSpecBuilder"]
    build_extensions:
      "lib/src/http/handlers/authoring_routes.dart": ["openapi/openapi.yaml"]
    auto_apply: root_package
    build_to: source
