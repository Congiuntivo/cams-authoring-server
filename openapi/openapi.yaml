openapi: '3.0.3'
info:
  title: 'Study Protocol Authoring API'
  version: '0.4.0'
  description: 'Stateful API exposing session-scoped protocol state and serialization endpoints.'
servers:
  -
    url: 'http://localhost:8080'
paths:
  /requirements:
    get:
      summary: 'Get current unfulfilled requirements for the session'
      operationId: 'getRequirements'
      description: 'Returns the current unfulfilled requirements for the session. Requires sessionId (will return 400 if missing or 404 if not found).'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Current unfulfilled requirements for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/new:
    post:
      summary: 'Create a new protocol authoring session'
      operationId: 'createProtocolSession'
      description: 'Creates an in-memory authoring session and returns a sessionId for subsequent requests.'
      parameters:
        -
          name: 'name'
          in: 'query'
          required: false
          description: 'Name of the protocol (optional, default: "Unnamed Protocol")'
          schema:
            type: 'string'
            example: 'My Study Protocol'
        -
          name: 'ownerId'
          in: 'query'
          required: false
          description: 'UUID of the protocol owner (optional, will be generated if not provided)'
          schema:
            type: 'string'
            example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
      responses:
        201:
          description: 'New authoring session created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
  /protocol/data-endpoint:
    post:
      summary: 'Add a data endpoint to a protocol in the session'
      operationId: 'addDataEndpoint'
      description: 'Adds a data endpoint to the session protocol. Requires sessionId. Protocol must already be started with POST /protocol/new.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'endpointType'
          in: 'query'
          required: false
          description: 'Endpoint type. Supported values: CAWS, SQLITE.'
          schema:
            type: 'string'
            example: 'CAWS'
        -
          name: 'uploadMethod'
          in: 'query'
          required: false
          description: 'CAWS upload method: stream, datapoint, or file.'
          schema:
            type: 'string'
            example: 'stream'
        -
          name: 'name'
          in: 'query'
          required: false
          description: 'Display name of the endpoint.'
          schema:
            type: 'string'
            example: 'CARP Web Services'
        -
          name: 'deleteWhenUploaded'
          in: 'query'
          required: false
          description: 'Whether local buffered data is deleted after upload.'
          schema:
            type: 'boolean'
            example: 'true'
      responses:
        200:
          description: 'Data endpoint added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/primary-device:
    post:
      summary: 'Add a primary device to the protocol in the session'
      operationId: 'addPrimaryDevice'
      description: 'Adds a primary device to the session protocol. Requires sessionId. Protocol must already be started with POST /protocol/new.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'deviceType'
          in: 'query'
          required: true
          description: 'Device type. Supported values: smartphone, browser.'
          schema:
            type: 'string'
            example: 'smartphone'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Display name of the device.'
          schema:
            type: 'string'
            example: 'User Phone'
      responses:
        200:
          description: 'Primary device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/participant-role:
    post:
      summary: 'Add a participant role to the protocol in the session'
      operationId: 'addParticipantRole'
      description: 'Adds a participant role. Requires sessionId. Protocol must already be started with POST /protocol/new.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: true
          description: 'Participant role name.'
          schema:
            type: 'string'
            example: 'Patient'
        -
          name: 'isOptional'
          in: 'query'
          required: false
          description: 'Whether the role is optional.'
          schema:
            type: 'boolean'
            example: 'false'
      responses:
        200:
          description: 'Participant role added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/participant-expected-data/role:
    post:
      summary: 'Add expected participant data for a specific role'
      operationId: 'addExpectedParticipantDataForRole'
      description: 'Adds expected participant data assigned to a specific role. Requires sessionId and roleName.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: true
          description: 'Existing participant role name.'
          schema:
            type: 'string'
            example: 'Patient'
        -
          name: 'dataType'
          in: 'query'
          required: true
          description: 'Participant input data type. Supported values: sex, phone_number, ssn, full_name, informed_consent, address, diagnosis, custom.'
          schema:
            type: 'string'
            example: 'sex'
      responses:
        200:
          description: 'Expected participant data added for role'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/participant-expected-data/all:
    post:
      summary: 'Add expected participant data for all roles'
      operationId: 'addExpectedParticipantDataForAllRoles'
      description: 'Adds expected participant data assigned to all roles. Requires sessionId and dataType.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'dataType'
          in: 'query'
          required: true
          description: 'Participant input data type. Supported values: sex, phone_number, ssn, full_name, informed_consent, address, diagnosis, custom.'
          schema:
            type: 'string'
            example: 'informed_consent'
      responses:
        200:
          description: 'Expected participant data added for all roles'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /serialize:
    get:
      summary: 'Return the serialized protocol for the session'
      operationId: 'serializeProtocol'
      description: 'Returns the serialized protocol for the session. Requires sessionId (will return 400 if missing or 404 if not found).'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Serialized protocol for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerializeResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: 'Protocol cannot be serialized until critical requirements are fulfilled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateSessionResponse:
      type: 'object'
      required:
        - 'sessionId'
      properties:
        sessionId:
          type: 'string'
    DataEndpointResponse:
      type: 'object'
      required:
        - 'sessionId'
        - 'unfulfilledRequirements'
      properties:
        sessionId:
          type: 'string'
        unfulfilledRequirements:
          type: 'object'
    RequirementsResponse:
      type: 'object'
      required:
        - 'unfulfilledRequirements'
      properties:
        unfulfilledRequirements:
          type: 'object'
    SerializeResponse:
      type: 'object'
      required:
        - 'name'
        - 'ownerId'
        - 'version'
      properties:
        name:
          type: 'string'
          example: 'My Study Protocol'
        ownerId:
          type: 'string'
          example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
        version:
          type: 'integer'
          example: 0
        id:
          type: 'string'
        createdOn:
          type: 'string'
        description:
          type: 'string'
        participantRoles:
          type: 'array'
          items:
            type: 'object'
        primaryDevices:
          type: 'array'
          items:
            type: 'object'
        connectedDevices:
          type: 'array'
          items:
            type: 'object'
        tasks:
          type: 'array'
          items:
            type: 'object'
        triggers:
          type: 'array'
          items:
            type: 'object'
        taskControls:
          type: 'array'
          items:
            type: 'object'
    ErrorResponse:
      type: 'object'
      required:
        - 'error'
      properties:
        error:
          type: 'string'