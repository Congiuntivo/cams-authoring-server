openapi: '3.0.3'
info:
  title: 'Study Protocol Authoring API'
  version: '0.4.0'
  description: 'Stateful API exposing session-scoped protocol state and serialization endpoints.'
servers:
  -
    url: 'http://localhost:8080'
paths:
  /requirements:
    get:
      summary: 'Get current unfulfilled requirements for the session'
      operationId: 'getRequirements'
      description: 'Returns the current unfulfilled requirements for the session. Requires sessionId (will return 400 if missing or 404 if not found).'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Current unfulfilled requirements for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/new/smartphone:
    post:
      summary: 'Create a new smartphone protocol authoring session'
      operationId: 'createSmartphoneProtocolSession'
      description: 'Creates an in-memory authoring session for a smartphone protocol and returns a sessionId for subsequent requests.'
      parameters:
        -
          name: 'name'
          in: 'query'
          required: false
          description: 'Name of the protocol (optional, default: "Unnamed Protocol")'
          schema:
            type: 'string'
            example: 'My Study Protocol'
        -
          name: 'ownerId'
          in: 'query'
          required: false
          description: 'UUID of the protocol owner (optional, will be generated if not provided)'
          schema:
            type: 'string'
            example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
      responses:
        201:
          description: 'New authoring session created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
  /protocol/new/default:
    post:
      summary: 'Create a new default protocol authoring session'
      operationId: 'createDefaultProtocolSession'
      description: 'Creates an in-memory authoring session for a default protocol and returns a sessionId for subsequent requests.'
      parameters:
        -
          name: 'name'
          in: 'query'
          required: false
          description: 'Name of the protocol (optional, default: "Unnamed Protocol")'
          schema:
            type: 'string'
            example: 'My Study Protocol'
        -
          name: 'ownerId'
          in: 'query'
          required: false
          description: 'UUID of the protocol owner (optional, will be generated if not provided)'
          schema:
            type: 'string'
            example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
      responses:
        201:
          description: 'New authoring session created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
  /serialize:
    get:
      summary: 'Return the serialized protocol for the session'
      operationId: 'serializeProtocol'
      description: 'Returns the serialized protocol for the session. Requires sessionId (will return 400 if missing or 404 if not found).'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Serialized protocol for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerializeResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: 'Protocol cannot be serialized until critical requirements are fulfilled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/data-endpoint:
    post:
      summary: 'Add a data endpoint to a protocol in the session'
      operationId: 'addDataEndpoint'
      description: 'Adds a data endpoint to the session protocol. Requires sessionId. Protocol must already be started with POST /protocol/new/smartphone or POST /protocol/new/default.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'endpointType'
          in: 'query'
          required: true
          description: 'Endpoint type. Supported values: CAWS, SQLITE.'
          schema:
            type: 'string'
            example: 'CAWS'
            enum:
              - 'CAWS'
              - 'SQLITE'
        -
          name: 'uploadMethod'
          in: 'query'
          required: false
          description: 'CAWS upload method: stream, datapoint, or file.'
          schema:
            type: 'string'
            example: 'stream'
            enum:
              - 'stream'
              - 'datapoint'
              - 'file'
        -
          name: 'name'
          in: 'query'
          required: false
          description: 'Display name of the endpoint.'
          schema:
            type: 'string'
            example: 'CARP Web Services'
        -
          name: 'deleteWhenUploaded'
          in: 'query'
          required: false
          description: 'Whether local buffered data is deleted after upload.'
          schema:
            type: 'boolean'
            example: 'true'
      responses:
        200:
          description: 'Data endpoint added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/primary-device:
    get:
      summary: 'Get primary device role name from the session protocol'
      operationId: 'getPrimarydevice'
      description: 'Returns the role name of the primary device in the session protocol. Requires sessionId and a configured primary device.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Primary device role name returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryDeviceResponse'
        400:
          description: 'Missing session id or no primary device configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/primary-device/smartphone:
    post:
      summary: 'Add a smartphone primary device to the session protocol'
      operationId: 'addSmartphonePrimaryDevice'
      description: 'Adds a smartphone primary device to the session protocol. Requires sessionId and an existing smartphone protocol started with POST /protocol/new/smartphone.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Display name of the device.'
          schema:
            type: 'string'
            example: 'User Phone'
      responses:
        200:
          description: 'Primary device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing query parameters or incompatible protocol type'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/primary-device/browser:
    post:
      summary: 'Add a browser primary device to the session protocol'
      operationId: 'addBrowserPrimaryDevice'
      description: 'Adds a browser primary device to the session protocol. Requires sessionId and an existing default protocol started with POST /protocol/new/default.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Display name of the device.'
          schema:
            type: 'string'
            example: 'Participant Browser'
      responses:
        200:
          description: 'Primary device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing query parameters or incompatible protocol type'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/participant-role:
    get:
      summary: 'Get participant role names from the session protocol'
      operationId: 'getParticipantRoles'
      description: 'Returns participant role names currently configured in the session protocol. Requires sessionId.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Participant role names returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRolesResponse'
        400:
          description: 'Missing session id or protocol not started'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: 'Add a participant role to the protocol in the session'
      operationId: 'addParticipantRole'
      description: 'Adds a participant role. Requires sessionId. Protocol must already be started with POST /protocol/new.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: true
          description: 'Participant role name.'
          schema:
            type: 'string'
            example: 'Patient'
        -
          name: 'isOptional'
          in: 'query'
          required: false
          description: 'Whether the role is optional.'
          schema:
            type: 'boolean'
            example: 'false'
      responses:
        200:
          description: 'Participant role added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/participant-expected-data/role:
    post:
      summary: 'Add expected participant data for a specific role'
      operationId: 'addExpectedParticipantDataForRole'
      description: 'Adds expected participant data assigned to a specific role. Requires sessionId and roleName.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: true
          description: 'Existing participant role name.'
          schema:
            type: 'string'
            example: 'Patient'
        -
          name: 'dataType'
          in: 'query'
          required: true
          description: 'Participant input data type. Supported values: sex, phone_number, ssn, full_name, informed_consent, address, diagnosis, custom.'
          schema:
            type: 'string'
            example: 'sex'
            enum:
              - 'sex'
              - 'phone_number'
              - 'ssn'
              - 'full_name'
              - 'informed_consent'
              - 'address'
              - 'diagnosis'
              - 'custom'
      responses:
        200:
          description: 'Expected participant data added for role'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/participant-expected-data/all:
    post:
      summary: 'Add expected participant data for all roles'
      operationId: 'addExpectedParticipantDataForAllRoles'
      description: 'Adds expected participant data assigned to all roles. Requires sessionId and dataType.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'dataType'
          in: 'query'
          required: true
          description: 'Participant input data type. Supported values: sex, phone_number, ssn, full_name, informed_consent, address, diagnosis, custom.'
          schema:
            type: 'string'
            example: 'informed_consent'
            enum:
              - 'sex'
              - 'phone_number'
              - 'ssn'
              - 'full_name'
              - 'informed_consent'
              - 'address'
              - 'diagnosis'
              - 'custom'
      responses:
        200:
          description: 'Expected participant data added for all roles'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/services:
    get:
      summary: 'Get service role names from the session protocol'
      operationId: 'getServiceRoles'
      description: 'Returns connected service role names currently configured in the session protocol. Requires sessionId.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Service role names returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRolesResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/services/weather:
    post:
      summary: 'Add weather service to the session protocol'
      operationId: 'addWeatherService'
      description: 'Adds weather service as a connected device. Requires sessionId and a configured primary device.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Optional role name for the weather service.'
          schema:
            type: 'string'
            example: 'Local Weather'
      responses:
        200:
          description: 'Weather service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/services/air-quality:
    post:
      summary: 'Add air quality service to the session protocol'
      operationId: 'addAirQualityService'
      description: 'Adds air quality service as a connected device. Requires sessionId and a configured primary device.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Optional role name for the air quality service.'
          schema:
            type: 'string'
            example: 'Local Air Quality'
      responses:
        200:
          description: 'Air quality service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/services/location:
    post:
      summary: 'Add location service to the session protocol'
      operationId: 'addLocationService'
      description: 'Adds location service as a connected device. Requires sessionId and a configured primary device.'
      parameters:
        -
          name: 'sessionId'
          in: 'query'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Optional role name for the location service.'
          schema:
            type: 'string'
            example: 'User Location'
        -
          name: 'accuracy'
          in: 'query'
          required: false
          description: 'Optional geolocation accuracy value from GeolocationAccuracy enum.'
          schema:
            type: 'string'
            example: 'balanced'
            enum:
              - 'powerSave'
              - 'low'
              - 'balanced'
              - 'high'
              - 'navigation'
              - 'reduced'
        -
          name: 'distance'
          in: 'query'
          required: false
          description: 'Optional distance in meters that triggers location updates.'
          schema:
            type: 'number'
            example: '10.0'
        -
          name: 'intervalSeconds'
          in: 'query'
          required: false
          description: 'Optional polling interval in seconds used for location updates.'
          schema:
            type: 'integer'
            example: '60'
        -
          name: 'notificationTitle'
          in: 'query'
          required: false
          description: 'Optional foreground notification title.'
          schema:
            type: 'string'
            example: 'Tracking active'
        -
          name: 'notificationMessage'
          in: 'query'
          required: false
          description: 'Optional foreground notification message.'
          schema:
            type: 'string'
            example: 'Location tracking is running.'
        -
          name: 'notificationDescription'
          in: 'query'
          required: false
          description: 'Optional foreground notification description.'
          schema:
            type: 'string'
            example: 'Tap to return to the app.'
        -
          name: 'notificationIconName'
          in: 'query'
          required: false
          description: 'Optional Android notification icon name.'
          schema:
            type: 'string'
            example: 'ic_notification'
        -
          name: 'notificationOnTapBringToFront'
          in: 'query'
          required: false
          description: 'Optional boolean to decide if notification tap should bring app to front.'
          schema:
            type: 'boolean'
            example: 'false'
      responses:
        200:
          description: 'Location service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters, invalid values, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateSessionResponse:
      type: 'object'
      required:
        - 'sessionId'
      properties:
        sessionId:
          type: 'string'
    DataEndpointResponse:
      type: 'object'
      required:
        - 'sessionId'
        - 'unfulfilledRequirements'
      properties:
        sessionId:
          type: 'string'
        unfulfilledRequirements:
          type: 'object'
    RequirementsResponse:
      type: 'object'
      required:
        - 'unfulfilledRequirements'
      properties:
        unfulfilledRequirements:
          type: 'object'
    PrimaryDeviceResponse:
      type: 'object'
      required:
        - 'roleName'
      properties:
        roleName:
          type: 'string'
    ParticipantRolesResponse:
      type: 'object'
      required:
        - 'roleNames'
      properties:
        roleNames:
          type: 'array'
          items:
            type: 'string'
    ServiceRolesResponse:
      type: 'object'
      required:
        - 'roleNames'
      properties:
        roleNames:
          type: 'array'
          items:
            type: 'string'
    SerializeResponse:
      type: 'object'
      required:
        - 'name'
        - 'ownerId'
        - 'version'
      properties:
        name:
          type: 'string'
          example: 'My Study Protocol'
        ownerId:
          type: 'string'
          example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
        version:
          type: 'integer'
          example: 0
        id:
          type: 'string'
        createdOn:
          type: 'string'
        description:
          type: 'string'
        participantRoles:
          type: 'array'
          items:
            type: 'object'
        primaryDevices:
          type: 'array'
          items:
            type: 'object'
        connectedDevices:
          type: 'array'
          items:
            type: 'object'
        tasks:
          type: 'array'
          items:
            type: 'object'
        triggers:
          type: 'array'
          items:
            type: 'object'
        taskControls:
          type: 'array'
          items:
            type: 'object'
    ErrorResponse:
      type: 'object'
      required:
        - 'error'
      properties:
        error:
          type: 'string'