openapi: '3.0.3'
info:
  title: 'Study Protocol Authoring API'
  version: '0.4.0'
  description: 'Stateful API exposing session-scoped protocol state and serialization endpoints.'
servers:
  -
    url: 'http://localhost:8080'
paths:
  /sessions/{sessionId}/requirements:
    get:
      summary: 'Get current unfulfilled requirements for the session'
      operationId: 'getRequirements'
      description: 'Returns the current unfulfilled requirements for the session.'
      tags:
        - 'Requirements and Serialization'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Current unfulfilled requirements for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /protocol/new/smartphone:
    post:
      summary: 'Create a new smartphone protocol authoring session'
      operationId: 'createSmartphoneProtocolSession'
      description: 'Creates an in-memory authoring session for a smartphone protocol and returns a sessionId for subsequent requests.'
      tags:
        - 'Sessions'
      parameters:
        -
          name: 'name'
          in: 'query'
          required: false
          description: 'Name of the protocol (optional, default: "Unnamed Protocol")'
          schema:
            type: 'string'
            example: 'My Study Protocol'
        -
          name: 'ownerId'
          in: 'query'
          required: false
          description: 'UUID of the protocol owner (optional, will be generated if not provided)'
          schema:
            type: 'string'
            example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
      responses:
        201:
          description: 'New authoring session created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
  /protocol/new/default:
    post:
      summary: 'Create a new default protocol authoring session'
      operationId: 'createDefaultProtocolSession'
      description: 'Creates an in-memory authoring session for a default protocol and returns a sessionId for subsequent requests.'
      tags:
        - 'Sessions'
      parameters:
        -
          name: 'name'
          in: 'query'
          required: false
          description: 'Name of the protocol (optional, default: "Unnamed Protocol")'
          schema:
            type: 'string'
            example: 'My Study Protocol'
        -
          name: 'ownerId'
          in: 'query'
          required: false
          description: 'UUID of the protocol owner (optional, will be generated if not provided)'
          schema:
            type: 'string'
            example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
      responses:
        201:
          description: 'New authoring session created'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
  /sessions/{sessionId}/serialize:
    get:
      summary: 'Return the serialized protocol for the session'
      operationId: 'serializeProtocol'
      description: 'Returns the serialized protocol for the session.'
      tags:
        - 'Requirements and Serialization'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Serialized protocol for the session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerializeResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: 'Protocol cannot be serialized until critical requirements are fulfilled'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/data-endpoint:
    post:
      summary: 'Add a data endpoint to a protocol in the session'
      operationId: 'addDataEndpoint'
      description: 'Adds a data endpoint to the session protocol. Protocol must already be started with POST /protocol/new/smartphone or POST /protocol/new/default.'
      tags:
        - 'Data Endpoint'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Data endpoint configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataEndpointRequest'
            example:
              endpointType: 'CAWS'
              uploadMethod: 'stream'
              name: 'CARP Web Services'
              deleteWhenUploaded: true
      responses:
        200:
          description: 'Data endpoint added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/primary-device:
    get:
      summary: 'Get primary device role name from the session protocol'
      operationId: 'getPrimarydevice'
      description: 'Returns the role name of the primary device in the session protocol.'
      tags:
        - 'Primary Device'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Primary device role name returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaryDeviceResponse'
        400:
          description: 'Missing session id or no primary device configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: 'Add a primary device to the session protocol'
      operationId: 'addPrimaryDevice'
      description: 'Adds a primary device to the session protocol using deviceType (smartphone or browser).'
      tags:
        - 'Primary Device'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Primary device payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryDeviceRequest'
            example:
              deviceType: 'smartphone'
              roleName: 'User Phone'
      responses:
        200:
          description: 'Primary device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementsResponse'
        400:
          description: 'Missing query parameters or incompatible protocol type'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/participant-roles:
    get:
      summary: 'Get participant role names from the session protocol'
      operationId: 'getParticipantRoles'
      description: 'Returns participant role names currently configured in the session protocol.'
      tags:
        - 'Participant Roles'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Participant role names returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantRolesResponse'
        400:
          description: 'Missing session id or protocol not started'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: 'Add a participant role to the protocol in the session'
      operationId: 'addParticipantRole'
      description: 'Adds a participant role. Protocol must already be started with POST /protocol/new/smartphone or POST /protocol/new/default.'
      tags:
        - 'Participant Roles'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: true
          description: 'Participant role name.'
          schema:
            type: 'string'
            example: 'Patient'
        -
          name: 'isOptional'
          in: 'query'
          required: false
          description: 'Whether the role is optional.'
          schema:
            type: 'boolean'
            example: 'false'
      responses:
        200:
          description: 'Participant role added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/participant-roles/{roleName}/expected-data:
    post:
      summary: 'Add expected participant data for a specific role'
      operationId: 'addExpectedParticipantDataForRole'
      description: 'Adds expected participant data assigned to a specific role.'
      tags:
        - 'Expected Participant Data'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'path'
          required: true
          description: 'Existing participant role name.'
          schema:
            type: 'string'
            example: 'Patient'
        -
          name: 'dataType'
          in: 'query'
          required: true
          description: 'Participant input data type. Supported values: sex, phone_number, ssn, full_name, informed_consent, address, diagnosis, custom.'
          schema:
            type: 'string'
            example: 'sex'
            enum:
              - 'sex'
              - 'phone_number'
              - 'ssn'
              - 'full_name'
              - 'informed_consent'
              - 'address'
              - 'diagnosis'
              - 'custom'
      responses:
        200:
          description: 'Expected participant data added for role'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/expected-data:
    post:
      summary: 'Add expected participant data for all roles'
      operationId: 'addExpectedParticipantDataForAllRoles'
      description: 'Adds expected participant data assigned to all roles.'
      tags:
        - 'Expected Participant Data'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'dataType'
          in: 'query'
          required: true
          description: 'Participant input data type. Supported values: sex, phone_number, ssn, full_name, informed_consent, address, diagnosis, custom.'
          schema:
            type: 'string'
            example: 'informed_consent'
            enum:
              - 'sex'
              - 'phone_number'
              - 'ssn'
              - 'full_name'
              - 'informed_consent'
              - 'address'
              - 'diagnosis'
              - 'custom'
      responses:
        200:
          description: 'Expected participant data added for all roles'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing or invalid query parameters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/services:
    get:
      summary: 'Get service role names from the session protocol'
      operationId: 'getServiceRoles'
      description: 'Returns connected service role names currently configured in the session protocol.'
      tags:
        - 'Services'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Service role names returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRolesResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/services/weather:
    post:
      summary: 'Add weather service to the session protocol'
      operationId: 'addWeatherService'
      description: 'Adds weather service as a connected device. Requires a configured primary device.'
      tags:
        - 'Services'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Optional role name for the weather service.'
          schema:
            type: 'string'
            example: 'Local Weather'
      responses:
        200:
          description: 'Weather service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/services/air-quality:
    post:
      summary: 'Add air quality service to the session protocol'
      operationId: 'addAirQualityService'
      description: 'Adds air quality service as a connected device. Requires a configured primary device.'
      tags:
        - 'Services'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Optional role name for the air quality service.'
          schema:
            type: 'string'
            example: 'Local Air Quality'
      responses:
        200:
          description: 'Air quality service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/services/health:
    post:
      summary: 'Add health service to the session protocol'
      operationId: 'addHealthService'
      description: 'Adds health service as a connected device. Requires a configured primary device.'
      tags:
        - 'Services'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
        -
          name: 'roleName'
          in: 'query'
          required: false
          description: 'Optional role name for the health service.'
          schema:
            type: 'string'
            example: 'Device Health'
      responses:
        200:
          description: 'Health service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/services/location:
    post:
      summary: 'Add location service to the session protocol'
      operationId: 'addLocationService'
      description: 'Adds location service as a connected device. Requires a configured primary device.'
      tags:
        - 'Services'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Location service configuration payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationServiceRequest'
            example:
              roleName: 'User Location'
              accuracy: 'balanced'
              distance: 10.0
              intervalSeconds: 60
              notificationTitle: 'Tracking active'
              notificationMessage: 'Location tracking is running.'
              notificationDescription: 'Tap to return to the app.'
              notificationIconName: 'ic_notification'
              notificationOnTapBringToFront: false
      responses:
        200:
          description: 'Location service added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters, invalid values, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/devices:
    get:
      summary: 'Get connected device role names from the session protocol'
      operationId: 'getDeviceRoles'
      description: 'Returns connected device role names currently configured in the session protocol.'
      tags:
        - 'Devices'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Device role names returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRolesResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/devices/e-sense:
    post:
      summary: 'Add an eSense device to the session protocol'
      operationId: 'addESenseDevice'
      description: 'Adds an eSense device as a connected device. Requires a configured primary device.'
      tags:
        - 'Devices'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'eSense device payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ESenseDeviceRequest'
            example:
              roleName: 'Left Earbud'
              isOptional: false
              deviceName: 'eSense-1234'
              samplingRate: 10
      responses:
        200:
          description: 'eSense device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters, invalid values, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/devices/movesense:
    post:
      summary: 'Add a Movesense device to the session protocol'
      operationId: 'addMovesenseDevice'
      description: 'Adds a Movesense device as a connected device. Requires a configured primary device.'
      tags:
        - 'Devices'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Movesense device payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovesenseDeviceRequest'
            example:
              roleName: 'Chest Sensor'
              isOptional: false
              name: 'Movesense 1234'
              address: 'AA:BB:CC:DD:EE:FF'
              serial: '220330000122'
              deviceType: 'UNKNOWN'
      responses:
        200:
          description: 'Movesense device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters, invalid values, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/devices/movisens:
    post:
      summary: 'Add a Movisens device to the session protocol'
      operationId: 'addMovisensDevice'
      description: 'Adds a Movisens device as a connected device. Requires deviceName and a configured primary device.'
      tags:
        - 'Devices'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Movisens device payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovisensDeviceRequest'
            example:
              roleName: 'Torso Sensor'
              deviceName: 'MOVISENS_ECG_01'
              sensorLocation: 'Chest'
              sex: 'Male'
              height: 178
              weight: 78
              age: 25
      responses:
        200:
          description: 'Movisens device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters, invalid values, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/devices/polar:
    post:
      summary: 'Add a Polar device to the session protocol'
      operationId: 'addPolarDevice'
      description: 'Adds a Polar device as a connected device. Requires a configured primary device.'
      tags:
        - 'Devices'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      requestBody:
        description: 'Polar device payload.'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolarDeviceRequest'
            example:
              roleName: 'Polar Chest Sensor'
              isOptional: false
              deviceType: 'H10'
              identifier: 'A1B2C3D4'
              name: 'Polar H10'
      responses:
        200:
          description: 'Polar device added'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataEndpointResponse'
        400:
          description: 'Missing query parameters, invalid values, or primary device not configured'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/tasks:
    get:
      summary: 'Get task summaries from the session protocol'
      operationId: 'getTasks'
      description: 'Returns configured task names and descriptions currently in the session protocol.'
      tags:
        - 'Tasks'
      parameters:
        -
          name: 'sessionId'
          in: 'path'
          required: true
          description: 'Session id returned by POST /protocol/new/smartphone or POST /protocol/new/default.'
          schema:
            type: 'string'
            example: 'session_1234567890_1'
      responses:
        200:
          description: 'Task summaries returned'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        400:
          description: 'Missing session id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: 'Session id not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CreateSessionResponse:
      type: 'object'
      required:
        - 'sessionId'
      properties:
        sessionId:
          type: 'string'
    DataEndpointResponse:
      type: 'object'
      required:
        - 'sessionId'
        - 'unfulfilledRequirements'
      properties:
        sessionId:
          type: 'string'
        unfulfilledRequirements:
          type: 'object'
    RequirementsResponse:
      type: 'object'
      required:
        - 'unfulfilledRequirements'
      properties:
        unfulfilledRequirements:
          type: 'object'
    PrimaryDeviceResponse:
      type: 'object'
      required:
        - 'roleName'
      properties:
        roleName:
          type: 'string'
    ParticipantRolesResponse:
      type: 'object'
      required:
        - 'roleNames'
      properties:
        roleNames:
          type: 'array'
          items:
            type: 'string'
    ServiceRolesResponse:
      type: 'object'
      required:
        - 'roleNames'
      properties:
        roleNames:
          type: 'array'
          items:
            type: 'string'
    DeviceRolesResponse:
      type: 'object'
      required:
        - 'roleNames'
      properties:
        roleNames:
          type: 'array'
          items:
            type: 'string'
    TaskSummary:
      type: 'object'
      required:
        - 'name'
        - 'description'
      properties:
        name:
          type: 'string'
          example: 'daily_survey'
        description:
          type: 'string'
          example: 'Daily participant survey'
    TasksResponse:
      type: 'object'
      required:
        - 'tasks'
      properties:
        tasks:
          type: 'array'
          items:
            $ref: '#/components/schemas/TaskSummary'
    SerializeResponse:
      type: 'object'
      required:
        - 'name'
        - 'ownerId'
        - 'version'
      properties:
        name:
          type: 'string'
          example: 'My Study Protocol'
        ownerId:
          type: 'string'
          example: '979b408d-784e-4b1b-bb1e-ff9204e072f3'
        version:
          type: 'integer'
          example: 0
        id:
          type: 'string'
        createdOn:
          type: 'string'
        description:
          type: 'string'
        participantRoles:
          type: 'array'
          items:
            type: 'object'
        primaryDevices:
          type: 'array'
          items:
            type: 'object'
        connectedDevices:
          type: 'array'
          items:
            type: 'object'
        tasks:
          type: 'array'
          items:
            type: 'object'
        triggers:
          type: 'array'
          items:
            type: 'object'
        taskControls:
          type: 'array'
          items:
            type: 'object'
    PrimaryDeviceRequest:
      type: 'object'
      required:
        - 'deviceType'
      properties:
        deviceType:
          type: 'string'
          enum:
            - 'smartphone'
            - 'browser'
          example: 'smartphone'
        roleName:
          type: 'string'
          example: 'User Phone'
    DataEndpointRequest:
      type: 'object'
      required:
        - 'endpointType'
      properties:
        endpointType:
          type: 'string'
          enum:
            - 'CAWS'
            - 'SQLITE'
          example: 'CAWS'
        uploadMethod:
          type: 'string'
          enum:
            - 'stream'
            - 'datapoint'
            - 'file'
          example: 'stream'
        name:
          type: 'string'
          example: 'CARP Web Services'
        deleteWhenUploaded:
          type: 'boolean'
          example: true
    ESenseDeviceRequest:
      type: 'object'
      properties:
        roleName:
          type: 'string'
        isOptional:
          type: 'boolean'
        deviceName:
          type: 'string'
        samplingRate:
          type: 'integer'
    MovesenseDeviceRequest:
      type: 'object'
      properties:
        roleName:
          type: 'string'
        isOptional:
          type: 'boolean'
        name:
          type: 'string'
        address:
          type: 'string'
        serial:
          type: 'string'
        deviceType:
          type: 'string'
          enum:
            - 'UNKNOWN'
            - 'MD'
            - 'HR_PLUS'
            - 'HR2'
            - 'FLASH'
          example: 'UNKNOWN'
    MovisensDeviceRequest:
      type: 'object'
      required:
        - 'deviceName'
      properties:
        roleName:
          type: 'string'
        deviceName:
          type: 'string'
          example: 'MOVISENS_ECG_01'
        sensorLocation:
          type: 'string'
          enum:
            - 'RightSideHip'
            - 'Chest'
            - 'RightWrist'
            - 'LeftWrist'
            - 'LeftAnkle'
            - 'RightAnkle'
            - 'RightThigh'
            - 'LeftThigh'
            - 'RightUpperArm'
            - 'LeftUpperArm'
            - 'LeftSideHip'
        sex:
          type: 'string'
          enum:
            - 'Male'
            - 'Female'
            - 'Intersex'
        height:
          type: 'integer'
        weight:
          type: 'integer'
        age:
          type: 'integer'
    PolarDeviceRequest:
      type: 'object'
      properties:
        roleName:
          type: 'string'
        isOptional:
          type: 'boolean'
        deviceType:
          type: 'string'
          enum:
            - 'UNKNOWN'
            - 'H9'
            - 'H10'
            - 'SENSE'
        identifier:
          type: 'string'
        name:
          type: 'string'
    LocationServiceRequest:
      type: 'object'
      properties:
        roleName:
          type: 'string'
        accuracy:
          type: 'string'
          enum:
            - 'powerSave'
            - 'low'
            - 'balanced'
            - 'high'
            - 'navigation'
            - 'reduced'
        distance:
          type: 'number'
        intervalSeconds:
          type: 'integer'
        notificationTitle:
          type: 'string'
        notificationMessage:
          type: 'string'
        notificationDescription:
          type: 'string'
        notificationIconName:
          type: 'string'
        notificationOnTapBringToFront:
          type: 'boolean'
    ErrorResponse:
      type: 'object'
      required:
        - 'error'
      properties:
        error:
          type: 'string'